name: env-subs
on: push
env:
  APP_NAME: journey
jobs:
  printer:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: info
    steps:
      - name: app-name printer
        run: |
          echo "$APP_NAME"
          echo "$LOG_LEVEL"
      - name: log-level printer
        env:
          LOG_LEVEL: debug
        run: |
          echo "$APP_NAME"
          echo "$LOG_LEVEL"

