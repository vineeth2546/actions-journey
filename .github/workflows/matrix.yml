name: matrix-test
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - name: Print the running version
        run: python3 c "import sys; print(sys.version)"
